server:
  port: 8080

spring:
  application:
    name: campus-book-share-backend
  datasource:
    # 默认连接本地 MySQL 3306
    # 如果本地 3306 被占用，或 root 密码不是 123456，
    # 请按实际环境修改 url、username、password
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_book_share?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: campusBookShareSecretKey
  expire: 604800
  header: Authorization
